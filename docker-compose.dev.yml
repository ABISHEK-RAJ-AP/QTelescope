# Default dev stack: PostgreSQL + Redis + API + UI
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
services:
  backend:
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@db:5432/quantum_telemetry
      REDIS_URL: redis://redis:6379/0
      USE_ALEMBIC: "true"
      CACHE_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./data:/app/data

  db:
    profiles: []
    image: postgres:16-alpine
    container_name: quantum_postgres
    environment:
      POSTGRES_DB: quantum_telemetry
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quantum_telemetry"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: quantum_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
