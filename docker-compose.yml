services:
  backend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.backend
    container_name: quantum_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/qtelescope.db}
      - USE_ALEMBIC=${USE_ALEMBIC:-true}
      - ENABLE_MOCK_DATA=${ENABLE_MOCK_DATA:-true}
      - ENVIRONMENT=${ENVIRONMENT:-}
      - QRE_PROFILE=${QRE_PROFILE:-}
      - SECRET_KEY=${SECRET_KEY:-}
      - REQUIRE_API_AUTH=${REQUIRE_API_AUTH:-}
      - ENFORCE_RBAC=${ENFORCE_RBAC:-}
      - BLOCK_DEFAULT_BOOTSTRAP_CREDENTIALS=${BLOCK_DEFAULT_BOOTSTRAP_CREDENTIALS:-}
      - ALLOW_ENV_CREDENTIAL_WRITE=${ALLOW_ENV_CREDENTIAL_WRITE:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - USER_USERNAME=${USER_USERNAME:-user_researcher}
      - USER_PASSWORD=${USER_PASSWORD:-}
      - IBM_QUANTUM_TOKEN=${IBM_QUANTUM_TOKEN:-}
      - RIGETTI_API_KEY=${RIGETTI_API_KEY:-}
      - IONQ_API_KEY=${IONQ_API_KEY:-}
      - ONPREM_QPU_URL=${ONPREM_QPU_URL:-http://localhost:8080}
    restart: always

  frontend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.frontend
    container_name: quantum_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

  # PostgreSQL (activate with --profile postgres; prefer docker-compose.postgres.yml)
  db:
    profiles: [postgres]
    image: postgres:16-alpine
    container_name: quantum_postgres
    environment:
      POSTGRES_DB: quantum_telemetry
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quantum_telemetry"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Optional Fast In-Memory Queue Broker for Real-Time Event Dispatch
  redis:
    image: redis:7-alpine
    container_name: quantum_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
