server {
    listen 80;
    server_name _;

    # VAPT baseline — also set at API layer; keep here for static SPA
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Hide nginx version
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Immutable hashed assets
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # API + SSE
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # Docs / OpenAPI — disabled in production builds (API also disables when ENVIRONMENT=production).
    # Uncomment only for lab debugging behind VPN.
    # location /docs { proxy_pass http://backend:8000/docs; }
    # location /redoc { proxy_pass http://backend:8000/redoc; }
    # location /openapi.json { proxy_pass http://backend:8000/openapi.json; }

    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }
}
