# Host nginx (Guacamole / bare Ubuntu) — not the Docker frontend image.
# Installed by scripts/setup-nginx-host.sh
# Placeholders: __SERVER_NAME__ __DIST_ROOT__ __LISTEN_PORT__

server {
    # Same port Vite preview uses (4173) — often open when :80 is filtered
    listen __LISTEN_PORT__ default_server;
    listen [::]:__LISTEN_PORT__ default_server;
    server_name __SERVER_NAME__;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    root __DIST_ROOT__;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # FastAPI on same machine
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }
}
