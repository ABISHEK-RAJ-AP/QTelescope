# TimescaleDB (Postgres + extension) for lab / VM migration.
# Default host port 5433 avoids clash with system Postgres on 5432.
#   TIMESCALE_PUBLISH_PORT=5434 docker compose -f docker-compose.timescale.yml --profile timescale up -d
services:
  db:
    profiles: [timescale]
    image: timescale/timescaledb:latest-pg16
    container_name: quantum_timescaledb
    environment:
      POSTGRES_DB: quantum_telemetry
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "${TIMESCALE_PUBLISH_PORT:-5433}:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./scripts/db/init-timescaledb.sql:/docker-entrypoint-initdb.d/01-init-timescale.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quantum_telemetry"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  timescaledb_data: