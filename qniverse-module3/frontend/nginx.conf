server {
    listen 80;
    
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Redirect /api calls to the backend service
    # This is useful so the frontend can just call /api/... instead of hardcoding localhost:8000
    # But usually frontend code refers to BACKEND_URL.
    # If the user uses CORS properly in backend (which main.py does: allow_origins=["*"]), this might not be strictly needed, but nice to have.
    # However, let's keep it simple and just serve the static files for now.
    
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
