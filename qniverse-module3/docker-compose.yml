version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "12346:12346"
    volumes:
      - ./backend:/app
    environment:
      - PORT=12346
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "12345:80"
    depends_on:
      - backend
    restart: unless-stopped