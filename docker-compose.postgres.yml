# Use with: docker compose -f docker-compose.yml -f docker-compose.postgres.yml --profile postgres up -d
services:
  backend:
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@db:5432/quantum_telemetry
      USE_ALEMBIC: "true"
    depends_on:
      db:
        condition: service_healthy

  db:
    profiles: [postgres]
    image: postgres:16-alpine
    container_name: quantum_postgres
    environment:
      POSTGRES_DB: quantum_telemetry
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quantum_telemetry"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
